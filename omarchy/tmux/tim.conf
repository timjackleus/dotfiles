# Tim's tmux layer for Omarchy.
# Source this after Omarchy's default tmux.conf so personal bindings and statusbar win.

# ----------------------------=== General ===--------------------------

set-option -g allow-rename off
set -g bell-action none
set -g visual-bell off
set-option -g default-command "exec $SHELL"

# Prefix
unbind C-b
unbind C-Space
set -g prefix C-a
bind C-a send-prefix

# ----------------------------=== Copy mode ===--------------------------

bind-key -T copy-mode-vi C-v send-keys -X rectangle-selection
bind-key -T copy-mode-vi / send-keys -X search-forward

# ----------------------------=== Panes and windows ===--------------------------

unbind a
bind-key a choose-tree -Zs -O name

unbind Space
bind-key Space switch-client -l

bind-key c new-window -c "#{pane_current_path}"
bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"

bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5

bind-key h previous-window
bind-key l next-window

unbind r
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

unbind x
bind-key x kill-pane

# Smart pane switching with awareness of Vim/Neovim splits.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+

# ----------------------------=== Theme ===--------------------------

# Use ANSI colors so Omarchy's active terminal theme controls the palette.
set -g pane-active-border-style "bg=default,fg=magenta"
set -g pane-border-style "fg=brightblack"

# ----------------------------=== Status line ===--------------------------

set -g status on
set -g status-position bottom
set -g status-style "bg=default,fg=brightblack"

set -g status-left-length 90
set -g status-right-length 90

set -g status-left ' #{tmux_mode_indicator} '
set -g status-right '#[fg=magenta]#S #[default] | #{weather} | #[bg=#{battery_status_bg}]#{battery_percentage} #{battery_remain}#[default] | #{cpu_fg_color} CPU: #{cpu_percentage} #[default] | #[fg=magenta]%d/%m #[fg=blue]%H:%M'

set -g @mode_indicator_prefix_prompt ' * '
set -g @mode_indicator_copy_prompt ' * '
set -g @mode_indicator_sync_prompt ' * '
set -g @mode_indicator_empty_prompt ' * '

set -g @mode_indicator_prefix_mode_style "bg=green,fg=black"
set -g @mode_indicator_sync_mode_style "bg=magenta,fg=black"
set -g @mode_indicator_empty_mode_style "bg=blue,fg=black"

set -g @cpu_percentage_format "%5.1f%%"
set -g @cpu_low_fg_color "#[fg=green]"
set -g @cpu_medium_fg_color "#[fg=yellow]"
set -g @cpu_high_fg_color "#[fg=red]"

set -g window-status-current-style "bg=default,fg=yellow"
set -g window-status-style "bg=default,fg=default"

setw -g window-status-current-format ' #{window_name} '
setw -g window-status-format ' #{window_name} '

# ----------------------------=== Plugins ===--------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g @plugin 'xamut/tmux-weather'
set -g @plugin 'tmux-plugins/tmux-yank'

run -b '~/.tmux/plugins/tpm/tpm'
